services:

  mysql:
    image: mysql:8.0
    container_name: online-course-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: online_course

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .
    container_name: online-course-backend

    depends_on:
      - mysql

    ports:
      - "8081:8081"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/online_course
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

volumes:
  mysql_data: